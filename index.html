<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday na ka💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Mali', cursive;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .gif-wrapper, .page-gif-wrapper {
            width: 320px;
            max-width: 90vw;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 107, 129, 0.4);
            border: 4px solid white;
            margin-bottom: 20px;
            background: #fff;
        }

        .gif-wrapper img, .page-gif-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            padding: 25px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.25);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .page {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #ff6b81; font-size: 1.8em; margin: 10px 0; }
        p { font-size: 1em; line-height: 1.6; color: #666; }

        .name-title {
            color: #ff4757;
            font-weight: 700;
            font-size: 2.5em;
            margin: 5px 0 15px 0;
            text-shadow: 2px 2px 4px rgba(255, 107, 129, 0.2);
        }

        .svg-cake-wrapper {
            width: 330px;
            height: 310px;
            margin: 0 auto;
        }

        /* Candle & Smoke VFX Styles */
        .candle { transition: opacity 0.3s ease; }
        .candle.out .flame-group { display: none !important; }
        .smoke-group { display: none; opacity: 0; transform-origin: center bottom; }
        .candle.out .smoke-group { display: block; animation: riseAndFade 2.2s ease-out forwards; }

        @keyframes riseAndFade {
            0% { opacity: 0.85; transform: translateY(0) scale(0.6); }
            50% { opacity: 0.6; transform: translateY(-20px) scale(1.1) translateX(-4px); }
            100% { opacity: 0; transform: translateY(-42px) scale(1.6) translateX(6px); }
        }

        /* Menu Buttons for Page 3 */
        .topic-menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            margin: 15px 0;
        }

        .topic-btn {
            background: #ffffff;
            color: #ff4757;
            border: 2px solid #ffccd5;
            padding: 16px 20px;
            font-size: 1.1em;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.12);
            transition: all 0.25s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topic-btn:hover {
            background: #fff0f3;
            border-color: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 129, 0.2);
        }

        /* Modal / Popup Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 25px 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 3px solid #ffccd5;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            color: #ff4757;
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-body {
            background: #fff5f7;
            border: 2px dashed #ff80ab;
            border-radius: 15px;
            padding: 15px;
            font-size: 1em;
            line-height: 1.6;
            color: #4a4a4a;
            margin-bottom: 15px;
            text-align: center;
            min-height: 240px;
            max-height: 320px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Enhanced Gift Box & Open Animation */
        .gift-box-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .gift-box-container:hover .gift-svg {
            transform: scale(1.05);
        }
        
        .gift-svg {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 8px 15px rgba(255,107,129,0.3));
            transition: transform 0.3s ease;
        }
        
        .gift-lid {
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: 80px 25px;
        }

        /* Lid flip animation when opened */
        .gift-box-container.open .gift-lid {
            transform: translateY(-65px) rotate(-40px) scale(0.9);
        }

        /* Glow Flash behind the box when opened */
        .glow-flash {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,182,193,0.8) 40%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 5;
        }
        .gift-box-container.open .glow-flash {
            animation: burstGlow 0.8s ease-out forwards;
        }

        @keyframes burstGlow {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(35); opacity: 0; }
        }

        /* Bouquet Reveal Card */
        .bouquet-card {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: bouquetPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bouquetPop {
            0% { opacity: 0; transform: scale(0.2) translateY(50px); }
            70% { transform: scale(1.05) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bouquet-img {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
            border: 4px solid #ffffff;
            object-fit: contain;
        }

        /* Flower Particles in Gift Modal */
        .flower-particle {
            position: absolute;
            font-size: 26px;
            pointer-events: none;
            animation: floatOutFlower 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 20;
        }
        @keyframes floatOutFlower {
            0% { opacity: 1; transform: translate(0, 0) scale(0.2) rotate(0deg); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--dr)); }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.3);
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn:hover { transform: scale(1.05); background: #ff4757; }
        .btn-secondary { background: #a4b0be; font-size: 1em; }
        .btn-secondary:hover { background: #747d8c; }

        .music-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid #ff80ab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
            transition: all 0.3s ease;
            overflow: hidden;
            width: 36px;
            height: 36px;
        }

        .music-controls:hover, .music-controls.active {
            width: 125px;
            padding: 6px 10px;
        }

        .music-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
        }

        .volume-slider {
            width: 0;
            height: 4px;
            accent-color: #ff6b81;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            margin-left: 6px;
        }

        .music-controls:hover .volume-slider, 
        .music-controls.active .volume-slider {
            width: 65px;
            opacity: 1;
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="start-overlay">
        <div class="gif-wrapper">
            <img src="horimiya.gif" alt="Horimiya Hug">
        </div>
        <h2 style="color: white; margin-bottom: 20px; font-size: 1.4em;">There’s a birthday gift waiting for you... 💖</h2>
        <button class="btn" style="background: white; color: #ff4757;" onclick="initWebsite()">
            Click to open the gift. 🎁🎵
        </button>
    </div>

    <div class="card">
        <div class="music-controls" id="music-controls">
            <button class="music-btn" onclick="toggleMusic(event)" title="เปิด/ปิดเพลง">🎵</button>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.6" oninput="changeVolume(this.value)" title="ปรับระดับเสียง">
        </div>

        <!-- Page 1 -->
        <div class="page active" id="page1">
            <h1>🎁 Happy Birthday</h1>
            <div class="name-title">To Ploy 💖</div>

            <div class="page-gif-wrapper">
                <img src="horimiya1.gif" alt="Horimiya Surprise">
            </div>
            <button class="btn" onclick="nextPage(2)">กดเปิดการ์ดตรงนี้สิ ✨</button>
        </div>

        <!-- Page 2 -->
        <div class="page" id="page2">
            <h1>Make a Wish! 🎂</h1>
            
            <div class="svg-cake-wrapper">

                            <circle cx="0" cy="0" r="4" fill="#ffd54f" />
                        </g>
                        <rect x="-42" y="-30" width="64" height="52" rx="22" fill="#fff0f3" stroke="#ff80ab" stroke-width="3" />
                        <rect x="-38" y="-26" width="56" height="44" rx="18" fill="#ffffff" stroke="#ffccd5" stroke-width="1.5" stroke-dasharray="3,2" />
                        <text x="-10" y="8" font-family="'Mali', cursive" font-weight="700" font-size="30" fill="#ff4d6d" text-anchor="middle">18</text>
                    </g>

                    <!-- Heart Sign Left -->
                    <g transform="translate(45, 185) rotate(-12) scale(0.85)" filter="drop-shadow(-2px 3px 3px rgba(0,0,0,0.12))">
                        <line x1="0" y1="20" x2="0" y2="72" stroke="#d7ccc8" stroke-width="2.5" />
                        <path d="M 0 -18 C -15 -35, -35 -10, 0 15 C 35 -10, 15 -35, 0 -18 Z" fill="#ff80ab" stroke="#ffffff" stroke-width="2" />
                        <text x="0" y="-5" font-family="'Mali', cursive" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">HAPPY</text>
                        <text x="0" y="4" font-family="'Mali', cursive" font-weight="700" font-size="7" fill="#ffffff" text-anchor="middle">BIRTHDAY</text>
                    </g>

                    <!-- Rainbow & Cloud -->
                    <g transform="translate(48, 258) scale(0.65)" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))">
                        <path d="M -20 0 A 20 20 0 0 1 20 0" fill="none" stroke="#ff80ab" stroke-width="4" />
                        <path d="M -16 0 A 16 16 0 0 1 16 0" fill="none" stroke="#ffe082" stroke-width="4" />
                        <path d="M -12 0 A 12 12 0 0 1 12 0" fill="none" stroke="#b2dfdb" stroke-width="4" />
                        <circle cx="-18" cy="2" r="8" fill="#ffffff" />
                        <circle cx="-10" cy="-2" r="9" fill="#ffffff" />
                        <circle cx="0" cy="2" r="7" fill="#ffffff" />
                    </g>

                    <!-- Lighter -->
                    <g transform="translate(262, 260) scale(0.7)" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))">
                        <rect x="0" y="0" width="35" height="16" rx="4" fill="#d7ccc8" />
                        <rect x="-8" y="3" width="10" height="10" rx="2" fill="#cfd8dc" />
                        <circle cx="-3" cy="8" r="3" fill="#90a4ae" />
                    </g>
                </svg>
            </div>

            <p id="wish-text" style="font-weight: 600; color: #ff4757; margin: 10px 0 10px;">
                ตั้งจิตอธิษฐานแล้วกดเป่าเทียนนะคนเก่ง ✨💖
            </p>

            <button class="btn" id="blow-btn" style="background: #ffeaa7; color: #d63031; margin-bottom: 5px;" onclick="blowCandleStepByStep()">
                กดเพื่อเป่าเทียน! 🌬️
            </button>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="nextPage(1)">⬅️ ถอยกลับ</button>
                <button class="btn" id="next-btn-page2" style="display: none;" onclick="nextPage(3)">หน้าถัดไป ➡️</button>
            </div>
        </div>

        <!-- Page 3 -->
        <div class="page" id="page3">
            <h1>🎂 Happy Birthday!</h1>
            <p style="margin-top: 0; color: #ff758c; font-size: 0.95em;">เลือกเปิดหัวข้อที่อยากอ่านได้เลยนะ 💕</p>
            
            <div class="topic-menu">
                <button class="topic-btn" onclick="openModal('gift')">
                    <span>🎁 ของขวัญวันเกิด</span>
                    <span>✨</span>
                </button>
                <button class="topic-btn" onclick="openModal('wish')">
                    <span>💌 คำอวยพร</span>
                    <span>✨</span>
                </button>
            </div>

            <!-- horimiya2.gif at the bottom of Page 3 -->
            <div class="page-gif-wrapper" style="margin-top: 10px; margin-bottom: 15px;">
                <img src="horimiya2.gif" alt="Horimiya Birthday">
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="nextPage(2)">⬅️ ถอยกลับ</button>
            </div>
        </div>

    </div>

    <!-- POPUP MODAL CONTAINER -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">หัวข้อ</div>
            <div class="modal-body" id="modal-body">
                <!-- Content inserted dynamically -->
            </div>
            <button class="btn" onclick="closeModal()">ปิดหน้าต่าง 💖</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        const audio = document.getElementById('bg-music');
        const musicControls = document.getElementById('music-controls');
        
        audio.volume = 0.6;

        function initWebsite() {
            audio.load();
            audio.play().then(() => {
                console.log("Audio playing perfectly!");
            }).catch(error => {
                console.log("Audio play error:", error);
            });
            
            document.getElementById('start-overlay').style.display = 'none';
        }

        function changeVolume(val) {
            audio.volume = val;
        }

        function toggleMusic(event) {
            if (event) event.stopPropagation();
            musicControls.classList.toggle('active');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        document.addEventListener('click', (e) => {
            if (!musicControls.contains(e.target)) {
                musicControls.classList.remove('active');
            }
        });

        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }

        function blowCandleStepByStep() {
            const candle = document.getElementById('candle-1');
            const wishText = document.getElementById('wish-text');
            const blowBtn = document.getElementById('blow-btn');
            const nextBtn = document.getElementById('next-btn-page2');

            if (candle && !candle.classList.contains('out')) {
                candle.classList.add('out');
                wishText.innerText = "เย้! เป่าเทียนดับแล้ว ขอให้คำอธิษฐานเป็นจริงนะ! ✨💖";
                blowBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                
                confetti({
                    particleCount: 120,
                    spread: 70,
                    origin: { y: 0.5 }
                });
            }
        }

        /* MODAL POPUP & ADVANCED GIFT BOX ANIMATION */
        const modalData = {
            wish: {
                title: "💌 คำอวยพร",
                html: "สุขสันต์วันเกิดนะคนเก่ง! ขอบคุณที่เข้ามาเป็นความสุขในทุกๆ วัน ขอให้เธอมีความสุขมากๆ ยิ้มเยอะๆ ในทุกวัน เจอแต่เรื่องน่ารักและคนที่ใจดีด้วยนะ รักแฟนที่สุดในโลก! 💕✨"
            }
        };

        function openModal(type) {
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-title');

            if (type === 'gift') {
                modalTitle.innerText = "🎁 ของขวัญวันเกิด";
                modalBody.innerHTML = `
                    <div class="gift-box-container" id="gift-box" onclick="openGiftBox(event)">
                        <div class="glow-flash"></div>
                        <svg class="gift-svg" id="gift-svg-elem" viewBox="0 0 100 100">
                            <!-- Gift Box Body -->
                            <rect x="20" y="40" width="60" height="45" rx="5" fill="#ff758c" />
                            <rect x="44" y="40" width="12" height="45" fill="#ff4757" />
                            <!-- Gift Box Lid -->
                            <g class="gift-lid">
                                <rect x="15" y="28" width="70" height="15" rx="3" fill="#ff80ab" />
                                <rect x="44" y="28" width="12" height="15" fill="#ff4757" />
                                <!-- Bow -->
                                <path d="M 35 18 C 25 10, 40 5, 47 25 Z" fill="#ff4757" />
                                <path d="M 65 18 C 75 10, 60 5, 53 25 Z" fill="#ff4757" />
                                <circle cx="50" cy="25" r="5" fill="#ff2e4c" />
                            </g>
                        </svg>
                        <p id="gift-hint" style="margin-top: 15px; color: #ff4757; font-weight: 700; font-size: 0.95em;">
                            แตะที่กล่องเพื่อเปิดของขวัญ 💖✨
                        </p>
                        
                        <!-- Bouquet Image Reveal (hidden by default) -->
                        <div class="bouquet-card" id="bouquet-card">
                            <img src="flower.jpg" alt="ช่อดอกไม้ของขวัญ" class="bouquet-img" onerror="this.src='https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=500&auto=format&fit=crop&q=80'">
                        </div>
                    </div>
                `;
            } else if (modalData[type]) {
                modalTitle.innerText = modalData[type].title;
                modalBody.innerHTML = modalData[type].html;
            }

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function openGiftBox(event) {
            const giftBox = document.getElementById('gift-box');
            const giftSvg = document.getElementById('gift-svg-elem');
            const giftHint = document.getElementById('gift-hint');
            const bouquetCard = document.getElementById('bouquet-card');
            const modalBody = document.getElementById('modal-body');

            if (!giftBox.classList.contains('open')) {
                giftBox.classList.add('open');

                // 1. Confetti Burst & Flower Explosion VFX
                confetti({
                    particleCount: 80,
                    spread: 100,
                    origin: { y: 0.6 }
                });

                const flowers = ['🌸', '🌷', '🌹', '🌺', '💖', '✨', '💐', '🌼'];
                for (let i = 0; i < 35; i++) {
                    const flower = document.createElement('div');
                    flower.className = 'flower-particle';
                    flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

                    const angle = Math.random() * Math.PI * 2;
                    const distance = 90 + Math.random() * 130;
                    const dx = Math.cos(angle) * distance + 'px';
                    const dy = Math.sin(angle) * distance + 'px';
                    const dr = (Math.random() * 360 - 180) + 'deg';

                    flower.style.setProperty('--dx', dx);
                    flower.style.setProperty('--dy', dy);
                    flower.style.setProperty('--dr', dr);
                    flower.style.left = '50%';
                    flower.style.top = '45%';

                    modalBody.appendChild(flower);
                }

                // 2. Hide Gift Box Icon & Show Flower Bouquet Image smoothly
                setTimeout(() => {
                    if (giftSvg) giftSvg.style.display = 'none';
                    if (giftHint) giftHint.style.display = 'none';
                    if (bouquetCard) bouquetCard.style.display = 'flex';
                }, 400);
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
